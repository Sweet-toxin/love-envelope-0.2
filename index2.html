<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Любовь в конверте</title>
<style>
  :root {
    --bg-dark: #0f0c29;
    --bg-mid: #302b63;
    --bg-light: #24243e;
    --accent-pink: #ffb3c6;
    --accent-red: #c44569;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--bg-dark), var(--bg-mid), var(--bg-light));
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    padding: 20px; overflow-x: hidden; position: relative;
  }

  /* Светящиеся частицы на фоне */
  .bg-particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
  .particle {
    position: absolute; background: #fff; border-radius: 50%; opacity: 0.3;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    50% { opacity: 0.6; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  /* ===== ФОРМА СОЗДАНИЯ ===== */
  .container {
    width: 100%; max-width: 520px; background: rgba(255,255,255,0.03); backdrop-filter: blur(16px);
    border-radius: 24px; padding: 40px 32px; border: 1px solid rgba(255,255,255,0.08); 
    box-shadow: 0 30px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
    position: relative; z-index: 1;
  }
  
  h1 { text-align: center; color: var(--accent-pink); font-family: Georgia, 'Times New Roman', serif; font-size: 2rem; margin-bottom: 8px; font-weight: 600; letter-spacing: 1px; }
  .subtitle { text-align: center; color: rgba(255,255,255,0.5); font-size: 0.85rem; margin-bottom: 30px; font-weight: 300; }
  
  label { display: block; color: rgba(255,255,255,0.7); font-size: 0.8rem; margin: 16px 0 8px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }
  
  input, textarea, select {
    width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.2); color: #fff; font-size: 0.95rem; outline: none; font-family: inherit;
    transition: all 0.3s ease;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent-pink); background: rgba(0,0,0,0.4); box-shadow: 0 0 15px rgba(255,179,198,0.2); }
  textarea { resize: vertical; min-height: 100px; line-height: 1.5; }
  select option { background: var(--bg-mid); color: #fff; }
  
  .color-row { display: flex; align-items: center; gap: 15px; background: rgba(0,0,0,0.2); padding: 10px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
  .color-row input[type="color"] { width: 40px; height: 40px; padding: 0; cursor: pointer; border: none; background: transparent; border-radius: 50%; overflow: hidden; }
  .color-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  .color-row input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }
  .color-row span { font-size: 0.85rem; color: rgba(255,255,255,0.6); }

  .btn {
    width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 1rem;
    font-family: inherit; font-weight: 600; cursor: pointer; transition: all 0.3s ease; margin-top: 24px; letter-spacing: 0.5px;
  }
  .btn-primary { background: linear-gradient(135deg, #ff6b9d, #c44569); color: #fff; box-shadow: 0 10px 25px rgba(196,69,105,0.4); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(196,69,105,0.6); }
  
  .link-box {
    margin-top: 20px; padding: 16px; background: rgba(0,0,0,0.3); border-radius: 12px;
    word-break: break-all; font-size: 0.8rem; color: var(--accent-pink); display: none; border: 1px dashed rgba(255,179,198,0.3);
    text-align: center;
  }
  .link-box.show { display: block; animation: fadeIn 0.5s; }
  .status { text-align: center; margin-top: 15px; font-size: 0.85rem; color: var(--accent-pink); font-weight: 500; }

  /* ===== ЭКРАН ЗАГРУЗКИ ===== */
  #loadingScreen {
    display: none; position: fixed; inset: 0; background: var(--bg-dark); z-index: 100;
    flex-direction: column; align-items: center; justify-content: center; color: #fff;
  }
  .loader-heart { font-size: 4rem; animation: beat 1s infinite alternate; margin-bottom: 20px; }
  @keyframes beat { from { transform: scale(1); } to { transform: scale(1.2); } }

  /* ===== СЦЕНА С КОНВЕРТОМ ===== */
  .scene { display: none; flex-direction: column; align-items: center; gap: 20px; width: 100%; max-width: 560px; position: relative; z-index: 1; }
  .scene.active { display: flex; animation: fadeIn 0.8s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  /* 3D Контейнер конверта */
  .envelope-wrapper {
    perspective: 1500px; width: 340px; height: 250px; position: relative; margin: 40px auto; cursor: pointer;
  }
  
  /* Вибрация при клике */
  .envelope-wrapper.shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes shake {
    10%, 90% { transform: translate3d(-2px, 0, 0); }
    20%, 80% { transform: translate3d(4px, 0, 0); }
    30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
    40%, 60% { transform: translate3d(6px, 0, 0); }
  }

  .envelope {
    position: relative; width: 100%; height: 100%; transform-style: preserve-3d;
  }

  /* Задняя часть конверта */
  .env-back {
    position: absolute; bottom: 0; width: 100%; height: 190px; border-radius: 10px;
    z-index: 1; box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
  }

  /* Письмо внутри */
  .letter-wrap {
    position: absolute; bottom: 10px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    width: 92%; height: 170px; z-index: 2;
    background: #fffdf8; border-radius: 6px;
    box-shadow: 0 0 15px rgba(0,0,0,0.1);
    transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), height 0.4s, width 0.4s;
    padding: 20px;
    overflow: hidden;
  }
  
  /* Текстура бумаги */
  .letter-wrap::before {
    content: ''; position: absolute; inset: 0; opacity: 0.4; pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.1'/%3E%3C/svg%3E");
  }

  /* Передняя часть (карман) */
  .env-front {
    position: absolute; bottom: 0; width: 100%; height: 190px;
    z-index: 3; clip-path: polygon(0 0, 50% 40%, 100% 0, 100% 100%, 0 100%);
    border-radius: 10px 10px 16px 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.3);
  }

  /* Клапан */
  .env-flap {
    position: absolute; top: 0; width: 100%; height: 130px;
    clip-path: polygon(0 0, 50% 100%, 100% 0); transform-origin: top center;
    transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), z-index 0s 0.4s;
    z-index: 4; border-radius: 10px 10px 0 0; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  /* ===== ЦВЕТА КОНВЕРТОВ ===== */
  .env-classic .env-back, .env-classic .env-front { background: linear-gradient(135deg, #e8456b, #a81f41); }
  .env-classic .env-flap { background: linear-gradient(180deg, #d63a5e, #e8456b); }
  .env-classic .seal { background: radial-gradient(circle at 30% 30%, #ff6b9d, #c23152); color: #ffb3c6; }

  .env-elegant .env-back, .env-elegant .env-front { background: linear-gradient(135deg, #2c3e50, #0f171e); }
  .env-elegant .env-flap { background: linear-gradient(180deg, #34495e, #2c3e50); }
  .env-elegant .seal { background: radial-gradient(circle at 30% 30%, #f1c40f, #b38f00); color: #2c3e50; }

  .env-sweet .env-back, .env-sweet .env-front { background: linear-gradient(135deg, #ff9a9e, #d47b7e); }
  .env-sweet .env-flap { background: linear-gradient(180deg, #fbc2eb, #ff9a9e); }
  .env-sweet .seal { background: radial-gradient(circle at 30% 30%, #ffffff, #f0d0d0); color: #ff9a9e; }

  /* ===== СУРГУЧНАЯ ПЕЧАТЬ ===== */
  .seal-container { position: absolute; top: 105px; left: 50%; transform: translateX(-50%); z-index: 5; }
  
  .seal {
    width: 60px; height: 60px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 1.8rem;
    box-shadow: inset 0 -4px 10px rgba(0,0,0,0.4), 0 6px 15px rgba(0,0,0,0.4);
    transition: all 0.3s ease; position: relative;
  }
  
  /* Блик на печати */
  .seal::before {
    content: ''; position: absolute; top: 10%; left: 20%; width: 30%; height: 30%;
    background: rgba(255,255,255,0.4); border-radius: 50%; filter: blur(2px);
  }

  /* Трещины */
  .seal.crack-1::after {
    content: ''; position: absolute; top: -10%; left: 50%; width: 2px; height: 60%;
    background: #000; transform: translateX(-50%) rotate(25deg); opacity: 0.6;
    box-shadow: 0 0 5px rgba(0,0,0,0.5);
  }
  .seal.crack-2::after {
    content: ''; position: absolute; top: -10%; left: 50%; width: 3px; height: 90%;
    background: #000; transform: translateX(-50%) rotate(25deg); opacity: 0.8;
  }
  .seal.crack-2::before {
    content: ''; position: absolute; top: 50%; left: -10%; width: 60%; height: 2px;
    background: #000; transform: translateY(-50%) rotate(-35deg); opacity: 0.6;
  }

  /* Анимация взрыва печати */
  .seal.broken {
    animation: sealBurst 0.5s forwards ease-in;
    pointer-events: none;
  }
  @keyframes sealBurst {
    0% { transform: scale(1); opacity: 1; filter: brightness(1); }
    50% { transform: scale(1.3); opacity: 1; filter: brightness(2); }
    100% { transform: scale(0); opacity: 0; }
  }

  /* Частицы взрыва */
  .shard {
    position: absolute; top: 50%; left: 50%; width: 8px; height: 8px;
    background: inherit; border-radius: 2px; opacity: 0; z-index: 6;
  }
  .seal.broken .shard { animation: shoot 0.6s ease-out forwards; }
  .shard:nth-child(1) { animation-delay: 0.0s; transform: translate(-50%, -50%) rotate(0deg); }
  .shard:nth-child(2) { animation-delay: 0.05s; transform: translate(-50%, -50%) rotate(45deg); }
  .shard:nth-child(3) { animation-delay: 0.1s; transform: translate(-50%, -50%) rotate(90deg); }
  .shard:nth-child(4) { animation-delay: 0.15s; transform: translate(-50%, -50%) rotate(135deg); }
  .shard:nth-child(5) { animation-delay: 0.2s; transform: translate(-50%, -50%) rotate(180deg); }
  .shard:nth-child(6) { animation-delay: 0.25s; transform: translate(-50%, -50%) rotate(225deg); }
  
  @keyframes shoot {
    0% { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(360deg); }
  }

  /* ===== АНИМАЦИЯ ОТКРЫТИЯ ===== */
  .envelope-wrapper.open .env-flap { transform: rotateX(180deg); z-index: 0; }
  .envelope-wrapper.open .letter-wrap { 
    transform: translateX(-50%) translateY(-130px); z-index: 4; cursor: pointer; 
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  }

  /* ===== РАЗВЕРНУТОЕ ПИСЬМО ===== */
  .letter-wrap.unfolded {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(1) !important;
    width: 90vw; max-width: 550px; height: auto; min-height: 60vh; max-height: 85vh;
    z-index: 50; cursor: pointer;
    background: #fffdf8; border-radius: 12px; padding: 40px;
    box-shadow: 0 40px 100px rgba(0,0,0,0.9), 0 0 0 100vmax rgba(0,0,0,0.7);
    display: flex; flex-direction: column; transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    overflow-y: auto;
  }
  .letter-wrap.unfolded:hover::after {
    content: '✕'; position: absolute; top: 15px; right: 20px; font-size: 1.5rem; color: #aaa; font-family: sans-serif;
  }

  .heart-icon { font-size: 1.5rem; text-align: center; line-height: 1; margin-bottom: 10px; }
  .letter-wrap.unfolded .heart-icon { display: none; }

  /* Стили текста письма */
  .letter-content { display: none; font-size: 1.25rem; line-height: 1.8; white-space: pre-wrap; font-family: Georgia, 'Times New Roman', serif; }
  .letter-wrap.unfolded .letter-content { display: block; }
  .letter-to { font-weight: 600; font-size: 1.5rem; margin-bottom: 20px; display: block; letter-spacing: 0.5px; }
  .letter-from { font-style: italic; text-align: right; margin-top: 30px; display: block; opacity: 0.8; font-size: 1.2rem; }
  
  /* Курсор печатной машинки */
  .cursor { display: inline-block; width: 2px; height: 1.2em; background: currentColor; animation: blink 0.8s infinite; vertical-align: bottom; margin-left: 2px; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  .hint { color: rgba(255,255,255,0.6); font-size: 0.9rem; text-align: center; animation: pulse 2s infinite; min-height: 20px; letter-spacing: 1px; }
  @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

  /* ===== НИЖНЯЯ ПАНЕЛЬ КНОПОК ===== */
  .bottom-actions { 
    display: none; justify-content: center; gap: 15px; width: 100%; max-width: 560px; 
    margin-top: 30px; z-index: 60; position: relative; animation: fadeIn 1s;
  }
  .bottom-actions.show { display: flex; }
  
  .bottom-actions .btn { 
    width: auto; flex: 0 1 auto; margin-top: 0; font-size: 0.9rem; padding: 12px 26px; 
    border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: all 0.3s ease;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }

  #downloadBtn { background: linear-gradient(135deg, #e53935, #e35d5b); color: #fff; border: none; }
  #downloadBtn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(229, 57, 53, 0.5); }

  #copyLinkBtn { background: rgba(255, 105, 180, 0.1); color: #ffb3c6; border: 1px solid rgba(255, 179, 198, 0.5); }
  #copyLinkBtn:hover { background: rgba(255, 105, 180, 0.2); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(255, 105, 180, 0.2); }
  
  /* Мобильная адаптация */
  @media (max-width: 480px) {
    .envelope-wrapper { width: 280px; height: 210px; }
    .env-back, .env-front { height: 160px; }
    .env-flap { height: 110px; }
    .seal-container { top: 85px; }
    .seal { width: 50px; height: 50px; font-size: 1.5rem; }
    .letter-wrap { height: 140px; padding: 15px; }
    .envelope-wrapper.open .letter-wrap { transform: translateX(-50%) translateY(-110px); }
    .container { padding: 30px 20px; }
    .bottom-actions { flex-direction: column; align-items: center; gap: 12px; }
    .bottom-actions .btn { width: 85%; }
    .letter-wrap.unfolded { padding: 25px; }
    .letter-content { font-size: 1.1rem; }
  }
</style>
</head>
<body>

<!-- Фоновые частицы -->
<div class="bg-particles" id="particles"></div>

<!-- ЭКРАН ЗАГРУЗКИ -->
<div id="loadingScreen">
  <div class="loader-heart">💖</div>
  <h2 style="color: #ffb3c6; margin-bottom: 10px; font-family: Georgia, serif;">Упаковываем чувства...</h2>
  <p style="color: rgba(255,255,255,0.5); font-size: 0.9rem;">Создаем магию</p>
</div>

<!-- ФОРМА СОЗДАНИЯ -->
<div class="container" id="createPanel">
  <h1>Любовь в конверте</h1>
  <p class="subtitle">Создайте послание и отправьте ссылкой</p>
  
  <label>Кому (имя получателя)</label>
  <input type="text" id="toName" placeholder="Например: Любимой Ане" maxlength="40">
  
  <label>От кого (ваше имя)</label>
  <input type="text" id="fromName" placeholder="Например: Навсегда твой, Максим" maxlength="40">
  
  <label>Текст послания</label>
  <textarea id="message" placeholder="Напишите здесь самые важные слова..." maxlength="600"></textarea>
  
  <label>Цвет чернил</label>
  <div class="color-row">
    <input type="color" id="textColor" value="#4a2c2a">
    <span>Выберите цвет текста в письме</span>
  </div>

  <label>Стиль конверта</label>
  <select id="envelopeStyle">
    <option value="env-classic">Классический красный</option>
    <option value="env-elegant">Элегантный синий</option>
    <option value="env-sweet">Нежный розовый</option>
  </select>

  <button class="btn btn-primary" id="generateBtn">Создать открытку ✨</button>
  <div class="link-box" id="linkBox"></div>
  <div class="status" id="status"></div>
</div>

<!-- СЦЕНА С КОНВЕРТОМ -->
<div class="scene" id="envelopeScene">
  <h1 style="color:var(--accent-pink); font-size:1.5rem; font-family: Georgia, serif; text-shadow: 0 2px 10px rgba(255,179,198,0.3);">Вам послание 💌</h1>
  
  <div class="envelope-wrapper" id="envelopeWrapper">
    <div class="envelope" id="envelope">
      <!-- Задняя стенка -->
      <div class="env-back"></div>
      
      <!-- Письмо -->
      <div class="letter-wrap" id="letterWrap">
        <div class="heart-icon">💗</div>
        <div class="letter-content" id="letterContent"></div>
      </div>
      
      <!-- Передняя стенка -->
      <div class="env-front"></div>
      
      <!-- Клапан -->
      <div class="env-flap"></div>
      
      <!-- Печать с частицами -->
      <div class="seal-container">
        <div class="seal" id="seal">
          ❤
          <!-- Частицы для взрыва -->
          <div class="shard" style="--x: -40px; --y: -50px;"></div>
          <div class="shard" style="--x: 50px; --y: -30px;"></div>
          <div class="shard" style="--x: -30px; --y: 40px;"></div>
          <div class="shard" style="--x: 60px; --y: 40px;"></div>
          <div class="shard" style="--x: -60px; --y: 0px;"></div>
          <div class="shard" style="--x: 40px; --y: 60px;"></div>
        </div>
      </div>
    </div>
  </div>
  
  <div class="hint" id="hintText">Нажмите на печать, чтобы сломать её</div>
</div>

<!-- НИЖНЯЯ ПАНЕЛЬ КНОПОК -->
<div class="bottom-actions" id="actionRow">
  <button class="btn" id="downloadBtn">💾 Скачать фото</button>
  <button class="btn" id="copyLinkBtn">🔗 Скопировать ссылку</button>
</div>

<script>
(function() {
  'use strict';

  // Генерация фоновых частиц
  const particlesContainer = document.getElementById('particles');
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 6 + 2;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (Math.random() * 10 + 10) + 's';
    p.style.animationDelay = (Math.random() * 10) + 's';
    particlesContainer.appendChild(p);
  }

  const createPanel = document.getElementById('createPanel');
  const loadingScreen = document.getElementById('loadingScreen');
  const envelopeScene = document.getElementById('envelopeScene');
  const actionRow = document.getElementById('actionRow');
  const envelopeWrapper = document.getElementById('envelopeWrapper');
  const seal = document.getElementById('seal');
  const letterWrap = document.getElementById('letterWrap');
  const letterContent = document.getElementById('letterContent');
  const hintText = document.getElementById('hintText');
  
  const toName = document.getElementById('toName');
  const fromName = document.getElementById('fromName');
  const message = document.getElementById('message');
  const textColor = document.getElementById('textColor');
  const envelopeStyle = document.getElementById('envelopeStyle');
  
  const generateBtn = document.getElementById('generateBtn');
  const linkBox = document.getElementById('linkBox');
  const status = document.getElementById('status');
  const downloadBtn = document.getElementById('downloadBtn');
  const copyLinkBtn = document.getElementById('copyLinkBtn');

  let currentData = null;
  let clickCount = 0;
  let typingInterval = null;
  let isTypingDone = false;

  // Кодирование/Декодирование (UTF-8 safe)
  function encodeData(obj) {
    const json = JSON.stringify(obj);
    const bytes = new TextEncoder().encode(json);
    let binary = '';
    bytes.forEach(b => binary += String.fromCharCode(b));
    return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function decodeData(str) {
    try {
      str = str.replace(/-/g, '+').replace(/_/g, '/');
      while (str.length % 4) str += '=';
      const binary = atob(str);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return JSON.parse(new TextDecoder().decode(bytes));
    } catch(e) { return null; }
  }

  function getDataFromHash() {
    const hash = location.hash.slice(1);
    if (!hash) return null;
    return decodeData(hash);
  }

  // Создание
  generateBtn.addEventListener('click', function() {
    const data = {
      to: toName.value.trim() || 'Любимому человеку',
      from: fromName.value.trim() || 'От всего сердца',
      msg: message.value.trim() || 'Ты — моё самое любимое чудо на свете.',
      color: textColor.value,
      style: envelopeStyle.value
    };

    const encoded = encodeData(data);
    
    createPanel.style.display = 'none';
    loadingScreen.style.display = 'flex';
    
    setTimeout(() => {
      loadingScreen.style.display = 'none';
      history.pushState(null, null, '#' + encoded);
      
      const url = location.href;
      linkBox.textContent = url;
      linkBox.classList.add('show');
      status.textContent = 'Ссылка скопирована в буфер обмена ✓';
      
      // Безопасное копирование
      try {
        navigator.clipboard.writeText(url);
      } catch(e) {
        const textArea = document.createElement("textarea");
        textArea.value = url;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand("copy");
        document.body.removeChild(textArea);
      }
      
      showEnvelope(data);
    }, 2000);
  });

  // Показ
  function showEnvelope(data) {
    currentData = data;
    clickCount = 0;
    isTypingDone = false;
    
    seal.className = 'seal';
    envelopeWrapper.className = 'envelope-wrapper ' + data.style;
    letterWrap.classList.remove('unfolded');
    letterContent.innerHTML = '';
    actionRow.classList.remove('show');
    envelopeScene.classList.add('active');
    
    hintText.textContent = 'Нажмите на печать, чтобы сломать её';
    hintText.style.display = 'block';
  }

  // Клик по конверту/письму
  envelopeWrapper.addEventListener('click', function(e) {
    if (letterWrap.classList.contains('unfolded')) {
      if (e.target.closest('.letter-wrap')) {
        letterWrap.classList.remove('unfolded');
      }
      return;
    }

    if (envelopeWrapper.classList.contains('open')) {
      if (e.target.closest('.letter-wrap')) {
        letterWrap.classList.add('unfolded');
        hintText.style.display = 'none';
        setTimeout(() => startTyping(currentData), 400);
      }
      return;
    }

    if (clickCount < 3) {
      clickCount++;
      
      envelopeWrapper.classList.add('shake');
      setTimeout(() => envelopeWrapper.classList.remove('shake'), 400);

      if (clickCount === 1) {
        seal.classList.add('crack-1');
        hintText.textContent = 'Ещё раз...';
      } else if (clickCount === 2) {
        seal.classList.add('crack-2');
        hintText.textContent = 'И последний раз!';
      } else if (clickCount === 3) {
        seal.classList.add('broken');
        
        setTimeout(() => {
          envelopeWrapper.classList.add('open');
          hintText.textContent = 'Нажмите на письмо, чтобы прочитать';
        }, 300);
      }
    }
  });

  // Печать текста
  function startTyping(data) {
    letterContent.innerHTML = `<span class="letter-to">${data.to},</span>`;
    letterContent.style.color = data.color;
    
    const msgText = data.msg;
    const textContainer = document.createElement('span');
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    letterContent.appendChild(textContainer);
    letterContent.appendChild(cursor);

    let i = 0;
    clearInterval(typingInterval);
    
    typingInterval = setInterval(() => {
      if (i < msgText.length) {
        if (msgText.charAt(i) === '\n') {
          textContainer.innerHTML += '<br>';
        } else {
          textContainer.innerHTML += msgText.charAt(i);
        }
        i++;
      } else {
        clearInterval(typingInterval);
        cursor.remove();
        
        const fromSpan = document.createElement('span');
        fromSpan.className = 'letter-from';
        fromSpan.textContent = data.from;
        letterContent.appendChild(fromSpan);
        
        if (!isTypingDone) {
            isTypingDone = true;
            actionRow.classList.add('show');
        }
      }
    }, 65); 
  }

  // Скачивание
  downloadBtn.addEventListener('click', function() {
    if (!currentData) return;
    
    const canvas = document.createElement('canvas');
    canvas.width = 1080; canvas.height = 1350;
    const ctx = canvas.getContext('2d');
    
    const gradient = ctx.createLinearGradient(0, 0, 1080, 1350);
    gradient.addColorStop(0, '#1a1a2e'); gradient.addColorStop(1, '#0f3460');
    ctx.fillStyle = gradient; ctx.fillRect(0, 0, 1080, 1350);
    
    ctx.strokeStyle = 'rgba(255,179,198,0.3)'; ctx.lineWidth = 4; ctx.strokeRect(50, 50, 980, 1250);
    ctx.font = '120px Georgia, serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('💗', 540, 250);
    
    ctx.fillStyle = currentData.color; ctx.font = 'bold 54px Georgia, serif'; ctx.fillText(currentData.to, 540, 400);
    ctx.beginPath(); ctx.moveTo(200, 480); ctx.lineTo(880, 480); ctx.stroke();
    
    ctx.font = '40px Georgia, serif';
    const words = currentData.msg.split(' '); let lines = []; let currentLine = '';
    for (const word of words) { 
      const test = currentLine ? currentLine + ' ' + word : word; 
      if (ctx.measureText(test).width > 800 && currentLine) { 
        lines.push(currentLine); currentLine = word; 
      } else { 
        currentLine = test; 
      } 
    }
    if (currentLine) lines.push(currentLine);
    lines.forEach((line, i) => { ctx.fillText(line, 540, 650 + i * 70); });
    
    ctx.fillStyle = currentData.color; ctx.font = 'italic 36px Georgia, serif'; ctx.fillText(currentData.from, 540, 1150);
    
    const link = document.createElement('a');
    link.download = 'love-card.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  // Копирование
  copyLinkBtn.addEventListener('click', function() {
    const url = location.href;
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(url).then(() => {
        showCopied();
      }).catch(() => fallbackCopy(url));
    } else {
      fallbackCopy(url);
    }
  });

  function fallbackCopy(text) {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    textArea.style.position = "fixed";
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
      document.execCommand('copy');
      showCopied();
    } catch (err) {
      prompt('Скопируйте ссылку вручную:', text);
    }
    document.body.removeChild(textArea);
  }

  function showCopied() {
    const original = copyLinkBtn.textContent;
    copyLinkBtn.textContent = '✓ Скопировано';
    setTimeout(() => { copyLinkBtn.textContent = original; }, 1500);
  }

  function init() {
    const data = getDataFromHash();
    if (data) {
      createPanel.style.display = 'none';
      showEnvelope(data);
    } else {
      createPanel.style.display = 'block';
      envelopeScene.classList.remove('active');
      actionRow.classList.remove('show');
    }
  }

  window.addEventListener('hashchange', init);
  init();
})();
</script>
</body>
</html>
